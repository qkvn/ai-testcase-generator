spring.application.name=demo

# Cấu hình Port (Ép Render nhận Port 8080 để không bị timeout)
server.port=${PORT:8080}

# Cấu hình Database MySQL (Ở máy sẽ chạy localhost, đưa lên Render sẽ tự động bị ghi đè)
spring.datasource.url=jdbc:mysql://localhost:3306/datn_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Cấu hình Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Cấu hình Groq API Key
GROQ_API_KEY=${GROQ_API_KEY:YOUR_GROQ_API_KEY}

# Chuyển nơi lưu Session từ RAM sang MySQL
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30d

# Bắt trình duyệt lưu "vé đăng nhập" 30 ngày
server.servlet.session.cookie.max-age=30d

# Cho phép gửi Cookie nhận diện giữa các môi trường chéo
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# ===== Tối ưu tốc độ =====
# Gom truy vấn các bước (steps) của nhiều test case thành 1 câu SQL thay vì N câu
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Gom nhiều câu INSERT/UPDATE thành batch khi lưu nhiều test case
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Giữ sẵn kết nối DB (tránh mở kết nối mới tới Aiven mỗi lần, rất tốn thời gian)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
